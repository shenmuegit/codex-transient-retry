[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-transient-retry"
version = "0.5.0"
description = "Local buffered retries for transient Codex inference and compaction failures"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: Microsoft :: Windows",
]

[project.optional-dependencies]
dev = ["build==1.6.1", "ruff==0.17.0"]

[project.urls]
Repository = "https://github.com/shenmuegit/codex-transient-retry"
Issues = "https://github.com/shenmuegit/codex-transient-retry/issues"

[project.scripts]
codex-transient-retry = "retry_proxy:main"

[tool.setuptools]
py-modules = ["retry_proxy"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
